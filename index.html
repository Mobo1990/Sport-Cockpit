<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sport Cockpit</title>
<meta name="theme-color" content="#0b0c0e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cockpit">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head><body>
<header class="top"><div class="wrap">
  <div class="bar1"><span class="brand">SPORT COCKPIT · 3ER-SPLIT</span><span class="sync" id="sync">Lade …</span></div>
  <div class="seg" role="group" aria-label="Trainingstag">
    <button data-a="day" data-d="push">Push</button><button data-a="day" data-d="pull">Pull</button><button data-a="day" data-d="legs">Legs</button><button data-a="day" data-d="cardio">Cardio</button>
  </div>
  <div class="dayrow">
    <div><h1 id="dayName">Push</h1><p class="sub" id="daySub"></p><div class="next" id="nextDay"></div></div>
    <div class="week" id="week" aria-label="Diese Woche"></div>
  </div>
  <div class="stats" id="stats"></div>
</div></header>
<main><div class="wrap" id="view"></div></main>
<div class="toast" id="toast" role="status"><b id="toastT"></b><span id="toastS"></span></div><div class="timer" id="timer"><b id="tLeft">1:30</b><div class="bar"><i id="tBar"></i></div><button data-a="t" data-s="-15">−15</button><button data-a="t" data-s="15">+15</button><button data-a="tstop">Fertig</button></div>
<nav class="nav" role="tablist">
  <button role="tab" data-a="view" data-v="home">Start</button>
  <button role="tab" data-a="view" data-v="train">Training</button>
  <button role="tab" data-a="view" data-v="nut">Essen</button>
  <button role="tab" data-a="view" data-v="rec">Kraft</button>
  <button role="tab" data-a="view" data-v="more">Mehr</button>
</nav>
<script src="app.js"></script>
</body></html>
